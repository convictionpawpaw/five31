<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FIVE31</title>
    <meta name="description" content="5/3/1 workout tracker — offline PWA." />

    <!-- iOS standalone / home-screen web app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FIVE31" />
    <meta name="theme-color" content="#060a0b" />

    <!-- Icons (public/ served at base). %BASE_URL% is rebased by Vite at build
         from vite.config's `base`, so these follow the deploy base automatically
         (GitHub Pages `/five31/` or a root-hosted Netlify `/`). -->
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
